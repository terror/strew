[package]
name = "strew"
version = "0.1.1"
description = "A tool to manage your dotfiles"
authors = ["Liam <liam@scalzulli.com>"]
license = "CC0-1.0"
repository = "https://github.com/terror/strew"
edition = "2024"
categories = ["command-line-utilities"]
keywords = ["dotfiles", "symlinks"]

include = [
  "/LICENSE",
  "/README.md",
  "/src/",
  "/tests/",
]

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.9", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.2"

[dev-dependencies]
indoc = "2.0.8"
pretty_assertions = "1.4.1"
tempfile = "3.27.0"
